{% extends "base.html" %}
{% block content %}
<div class="card p-4">{{ content|safe }}</div>

<div class="card p-4 mt-4">
    <h3>Quick Quiz</h3>
    <p>Answer these 5 questions to complete your training.</p>
    <div id="quiz"></div>
    <button id="submit-quiz" class="btn btn-primary mt-3" style="display:none;">Submit Quiz</button>
    <div id="results" class="mt-3"></div>
</div>

<script>
const quiz = {{ quiz|tojson }};
const sendId = "{{ send_id }}";
const container = document.getElementById("quiz");

quiz.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "mb-4 p-3 border rounded";
    div.innerHTML = `<p><strong>${i+1}. ${q.question}</strong></p>` +
        q.options.map((opt, j) =>
            `<label class="d-block"><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`
        ).join("");
    container.appendChild(div);
});
document.getElementById("submit-quiz").style.display = "block";

document.getElementById("submit-quiz").onclick = async () => {
    let score = 0;
    quiz.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && parseInt(selected.value) === q.correct_index) score++;
    });
    const pct = Math.round(score / quiz.length * 100);
    await fetch(`/training/${sendId}/complete`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({score: pct})
    });
    document.getElementById("results").innerHTML =
        `<div class="alert alert-success"><h4>Training Complete! Score: ${pct}%</h4>
         <p>Thanks for completing this session. Stay vigilant!</p></div>`;
    document.getElementById("submit-quiz").disabled = true;
};
</script>
{% endblock %}
