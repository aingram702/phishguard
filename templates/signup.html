{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="mb-4">Create your PhishGuard account</h2>
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" name="company_name" class="form-control" required maxlength="200">
                </div>
                <div class="mb-3">
                    <label class="form-label">Company Domain (e.g. acme.com)</label>
                    <input type="text" name="company_domain" class="form-control" required maxlength="200">
                </div>
                <div class="mb-3">
                    <label class="form-label">Your Email</label>
                    <input type="email" name="email" class="form-control" required maxlength="200">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password <small class="text-muted">(min 12 characters)</small></label>
                    <input type="password" name="password" class="form-control" required minlength="12" maxlength="128">
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
